name: MATLAB Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Run MATLAB build
        uses: matlab-actions/run-build@v3
        with:
          tasks: check test
